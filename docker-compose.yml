version: '3.8'

services:
  backend:
    build: 
      context: ./server
    container_name: autousata-backend
    ports:
      - "3008:3008"
    env_file:
      - ./server/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  frontend:
    build: 
      context: ./client
    container_name: autousata-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always